[package]
name = "loricad"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Gates the assertion that the tick allocates nothing. That test loads the eBPF object and
# creates maps, which needs CAP_BPF, so it must not be part of an unprivileged
# `cargo test --workspace` — it fails there with EPERM on the first map and reads as a
# broken build rather than as a test that was never meant to run. Same discipline as
# lorica-dataplane, which gates every test that touches a kernel behind a feature of its own.
[features]
kernel-tests = []

# Native histograms divide the cardinality of a latency distribution by about twenty, and
# the Prometheus text format has no field for them: prometheus-client's text encoder falls
# back to the classic buckets and rejects a native-only histogram outright. The text
# endpoint is what this project ships to a VPS, so this is a feature and never the default;
# with it on the histogram carries both representations and only a protobuf scraper sees
# the difference.
native-histograms = []

[dependencies]
lorica-common.workspace = true
lorica-dataplane.workspace = true
lorica-detect.workspace = true
lorica-escalate.workspace = true
lorica-policy.workspace = true
anyhow.workspace = true
arc-swap.workspace = true
aya.workspace = true
crossbeam-utils.workspace = true
memmap2.workspace = true
redb.workspace = true
# current_thread only. #[tokio::main] would spawn one worker per logical CPU and
# steal cache lines from the application this is supposed to protect.
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "io-util", "signal"] }
# Allocates nothing per series and renders from handles the agent resolves at startup. No
# HTTP framework alongside it: /metrics is a GET that returns text, and the response is
# written by hand onto the tokio TcpStream this crate already has.
prometheus-client = "0.25.0"
# Quantiles at 9.5 ns per insertion and mergeable across agents. Three gauges come out of
# it; a summary would invite averaging a q99, which is not a number.
sketches-ddsketch = "0.3.1"
# release_max_level_info removes trace! and debug! from the release binary rather than
# filtering them at runtime: the callsite disappears, so a debug line in the tick costs
# nothing instead of costing a level comparison. No tracing-appender: its non_blocking buffer
# holds 128 000 lines by default, about 18 MB at the line width measured in
# tests/log_volume.rs, and it fills exactly during an attack. The buffer is the kernel's
# socket, not this RSS.
tracing = { workspace = true, features = ["release_max_level_info"] }
tracing-subscriber.workspace = true
zerocopy.workspace = true
