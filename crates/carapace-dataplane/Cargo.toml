[package]
name = "carapace-dataplane"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Tests that need a live kernel: loading, attaching, BPF_PROG_TEST_RUN. Off by
# default so `cargo test --workspace` stays green on Windows.
kernel-tests = []
# Counts helper calls actually executed for one packet. Distinct from the static ELF
# budget: this one measures the per-packet budget of the spec.
count-helpers = []

[dev-dependencies]
# Reads the compiled eBPF object. Portable and already in the tree through aya, so
# the static guard adds nothing to the dependency surface.
object.workspace = true

[dependencies]
carapace-common.workspace = true
aya.workspace = true
libc.workspace = true
thiserror.workspace = true
