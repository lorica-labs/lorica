[package]
name = "carapaced"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
carapace-common.workspace = true
carapace-dataplane.workspace = true
carapace-detect.workspace = true
carapace-escalate.workspace = true
carapace-policy.workspace = true
anyhow.workspace = true
# current_thread only. #[tokio::main] would spawn one worker per logical CPU and
# steal cache lines from the application this is supposed to protect.
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "io-util", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
