[package]
name = "lorica-ebpf"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/lorica-labs/lorica"

# Its own workspace: this crate builds for bpfel-unknown-none on nightly with
# -Z build-std=core, and cargo cannot select a toolchain per member of the root
# workspace.
[workspace]

[features]
# Mirror of the userspace feature. Counts the helper calls actually executed for one
# packet, so a test can assert the per-packet budget of the spec.
count-helpers = []
# Publishes the parsed view into a map. Parsing has to be verifiable before any stage
# exists to act on it.
parse-probe = []
# Selects the bucketised cuckoo table of stage 3 instead of the sixteen unrolled Robin Hood
# probes. **The Robin Hood table is the default and stays it**: what decides the switch is
# instructions per packet and cycles under attack traffic, and neither is a simulation.
#
# A feature and not a load-time global, for two reasons the other flags of this crate do not
# have. The two tables are the same 16 MiB of `.bss` under two names — both in one object would
# be 36 MiB against the 20 MiB budget the flat tables exist for — so they cannot coexist at run
# time. And the probe sequences are structurally different: one is sixteen unrolled steps and
# the other is two, so a run-time choice would put both in the program and measure neither.
#
# `lorica-policy::blocklist::cuckoo_from` is what fills the table for a measurement.
blocklist-cuckoo = []
# Selects the jump-table backend of stage 6 instead of the branch cascade. A feature and
# not a run-time choice because eBPF has no method table to dispatch through, so there is
# nothing to select at run time. Off until `gotox` is on a kernel floor this project can
# ask for.
signature-dfa = []
# Stops the pipeline after a chosen stage, so the cost of one stage is the difference
# between two whole-path measurements. It measures whole paths and not symbols, which is
# why it needs no subprogram boundary and works on the inlined object: a profile
# attributes cycles to four symbols all named `run` and to a dispatcher trampoline that
# absorbs a third of the samples, while a difference of nanoseconds needs no denominator.
# Compiles the IPv6 walker out of the program, so a measurement can say what carrying it costs
# an IPv4 deployment. **A measurement and never a shipped configuration**: an object built with
# this answers `UnknownEncap` — that is, `XDP_PASS` — for every IPv6 packet, which is a filter
# with a hole in it and not a faster filter.
#
# It exists because deleting the fast path showed that code the packet never executes is not
# free: less of it in the entry point is fewer instructions executed everywhere, because the
# register allocator has more to work with. `ipv6::parse` is 214 of the 914 instructions there
# and an IPv4 packet runs none of them, so the size of that effect is worth a number.
measure-without-ipv6 = []
stage-cutoff = []
# Puts each parser back in a subprogram of its own, so it has a JIT symbol a `perf`
# campaign can attribute cycles to. Instrumentation, not a property of the program: the
# object that ships inlines the parsers and pays for none of their boundaries. The stages
# keep theirs either way, for the measured reason stated at the first of them.
profiling = []

[dependencies]
lorica-common = { path = "../lorica-common" }
aya-ebpf = "0.2.1"

[[bin]]
name = "lorica-ebpf"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# bpf-linker derives BTF from DWARF, so --btf emits nothing without debug info.
debug = 2
overflow-checks = false
