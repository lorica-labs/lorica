[package]
name = "carapace-ebpf"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/hookwood/carapace"

# Its own workspace: this crate builds for bpfel-unknown-none on nightly with
# -Z build-std=core, and cargo cannot select a toolchain per member of the root
# workspace.
[workspace]

[features]
# Mirror of the userspace feature. Counts the helper calls actually executed for one
# packet, so a test can assert the per-packet budget of the spec.
count-helpers = []
# Publishes the parsed view into a map. Parsing has to be verifiable before any stage
# exists to act on it.
parse-probe = []

[dependencies]
carapace-common = { path = "../carapace-common" }
aya-ebpf = "0.2.1"

[[bin]]
name = "carapace-ebpf"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# bpf-linker derives BTF from DWARF, so --btf emits nothing without debug info.
debug = 2
overflow-checks = false
