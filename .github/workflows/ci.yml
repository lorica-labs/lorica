name: ci

# No branch filter on purpose. This project carries one integration branch per phase —
# lab/measurements, core/foundation, core/deterministic-defenses, and so on — so the
# default branch is renamed at every phase boundary. A branch name written here goes
# stale silently: the filter said `master`, that branch was deleted once the phase-1
# integration branch became the default, and the whole workflow simply stopped running.
# A workflow that never fires looks exactly like a workflow that always passes.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that needs no kernel. Runs on every pull request and is the only
  # job that also passes on Windows, which is where the static guards were
  # designed to run.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo install bpf-linker --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build the eBPF program
        run: cargo +nightly build --release
        working-directory: crates/lorica-ebpf
      - name: lint the eBPF program
        run: |
          cargo +nightly fmt --check
          cargo +nightly clippy --release -- -D warnings
        working-directory: crates/lorica-ebpf
      - run: cargo test --workspace
      # Assertions 1 and 6 need the crate that cannot be built here, so they live in
      # the integration job. The table in mesure-et-outillage.md marks both as
      # runnable on Windows; that rests on a premise the code disproved. aya uses
      # std::os::fd, so lorica-dataplane and loricad do not build on Windows at
      # all, and both assertions need one of them.
      #
      # Assertion 7, the Prometheus series ceiling, arrives with /metrics in a later
      # phase. It is named here so its absence is a gap somebody can see rather than
      # a step nobody wrote.

  # Loads the program on the runner kernel and attaches it to a veth pair.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo install bpf-linker --locked
      # clang builds the bench objects the attach test takes the hook with, perf
      # counts the xdp_exception tracepoint.
      - run: sudo apt-get update && sudo apt-get install -y clang linux-tools-common linux-tools-generic
      - run: cargo clippy --workspace --all-targets --features lorica-dataplane/kernel-tests -- -D warnings
      # Loading an XDP program needs CAP_BPF and CAP_NET_ADMIN, so the test
      # binaries run under sudo while the build stays unprivileged. This is the
      # same script the lab runs, and it builds both eBPF objects: the one that
      # ships and the instrumented one the tests read counters out of.
      #
      # Three of the seven assertions are test files inside this run, and they are
      # named here rather than re-run as separate steps:
      #   assertion 1  tests/helper_budget.rs    helper calls present in the program
      #   assertion 2  tests/jited_size.rs       size of the JIT-compiled program
      #   assertion 4  tests/xdp_exception.rs    unintended drops, strict, == 0
      #
      # Assertion 2 does not use `bpftool prog show --json` as originally planned:
      # bpftool cannot load this object at all, because aya emits legacy map
      # definitions that libbpf dropped in 1.0. It reads jited_prog_len from the
      # kernel instead, which is the field bpftool renders as bytes_jited.
      - name: kernel tests, and assertions 1, 2 and 4
        run: bash scripts/lab/kernel-tests.sh
      # Assertion 6: no allocation inside the tick. A separate step because the run
      # above tests the dataplane crate and this assertion lives in the agent.
      - name: no allocation in the tick
        run: bash scripts/lab/kernel-tests.sh --crate loricad --test no_alloc_in_tick
      # Assertion 5: the agent's RSS, and its CPU while it is at it. Both come from
      # the same run, because measuring them separately would measure two agents.
      #
      # The cadence is the one the phase settled on and not the default: fifty
      # thousand slots swept every two seconds with the named counters at ten hertz.
      # Reading every slot every tick costs 13 % of a core on the target, measured,
      # so passing the default here would assert a budget nothing meets.
      #
      # The runner has more cores and a different memory system than the target, so
      # the CPU budget is looser here than the 0.74 % measured there: this step
      # catches a regression of an order of magnitude, and the number that stands is
      # the one from the target.
      - name: agent RSS and CPU
        run: |
          cargo build --release -p loricad
          scripts/lab/measure-agent-cpu.sh             --agent target/release/loricad             --object crates/lorica-ebpf/target/bpfel-unknown-none/release/lorica-ebpf             --counters 50000 --hz 10 --sweep-every 20             --duration 70 --settle 30 --cpu-budget 3.0 --rss-max 51200             --out bench/results/agent-cpu

  # Assertion 3, the per-packet cost, is deliberately not a step here.
  #
  # It is armed, and it is armed on the measurement VM: `measure-stage-cost.sh
  # --max-instructions 765`. Two reasons it cannot be a runner step. The script drives
  # two lab machines over SSH, one to build a static musl binary and one to run it,
  # because the machine with the target kernel has no toolchain. And the quantity is
  # machine-specific: it is the instruction count of the whole pipeline with the count of
  # the program returning immediately subtracted, which reproduces to 0.2 % on one machine
  # and means something else on another.
  #
  # It is named here rather than left out so that its absence is visible, the same reason
  # assertion 7 is named before `/metrics` exists. The ceiling and the figure behind it are
  # in the phase measurement report.

  # 6.8 is the core floor, 6.12 the floor of the SYN cookie module, plus the
  # newest LTS. A failure on 6.8 is blocking: it is the audience.
  #
  # The tests run on the runner kernel when it is one of the three, and under
  # virtme-ng otherwise, which pulls a precompiled kernel from the Ubuntu mainline
  # archive. A runner without /dev/kvm makes those versions declared unobtained
  # rather than silently skipped, which is why this job is allowed to report amber.
  kernel-matrix:
    # On the default branch and on every pull request, and no branch name spelled out here.
    #
    # The default branch carries only closed phases, so a phase in progress lives on its own
    # integration branch and this job would never see it. A pull request is how that work
    # reaches the default branch, which makes the merge the moment the three-kernel guarantee
    # actually has to hold. During a phase the matrix is run by hand — it is a line of the
    # phase verification sequence — and that is where it has caught things: twice in phase 1,
    # once a JITed ceiling and once a test that assumed the machine had a routing table.
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo install bpf-linker --locked
      # The test binaries are static musl: a virtme-ng guest has the host filesystem
      # read-only and no toolchain, so nothing can be built on the kernel under test.
      - run: rustup target add x86_64-unknown-linux-musl
      # clang builds the bench objects that travel with the tests, perf counts
      # xdp:xdp_exception, virtme-ng supplies the kernels the runner is not running.
      - run: sudo apt-get update && sudo apt-get install -y clang virtme-ng linux-tools-common linux-tools-generic
      - run: scripts/lab/kernel-matrix.sh v6.8 v6.12 v7.0
