[workspace]
resolver = "3"
members = [
    "crates/lorica-common",
    "crates/lorica-dataplane",
    "crates/lorica-detect",
    "crates/lorica-policy",
    "crates/lorica-escalate",
    "crates/loricad",
    "crates/lorica-ctl",
    "crates/lorica-export",
]
# lorica-ebpf is a workspace of its own, not a member. bpfel-unknown-none is a
# tier 3 target: it needs nightly and -Z build-std=core, and a toolchain cannot be
# selected per workspace member. Building it is an explicit step, not a side effect
# of `cargo check --workspace`.
exclude = ["bench", "crates/lorica-ebpf"]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/lorica-labs/lorica"
# 1.90 and not 1.89 because redb 4.2 declares it. The floor is a dependency's and not this
# tree's: nothing here uses a 1.90 feature.
rust-version = "1.90"

[workspace.dependencies]
lorica-common = { path = "crates/lorica-common" }
lorica-dataplane = { path = "crates/lorica-dataplane" }
lorica-detect = { path = "crates/lorica-detect" }
lorica-escalate = { path = "crates/lorica-escalate" }
lorica-policy = { path = "crates/lorica-policy" }

anyhow = "1.0.104"
# One immutable snapshot published per tick, read by whoever asks. Readers take their own
# Arc and the tick never waits for one, which is what keeps a scrape that stopped reading
# from sitting in front of the timer. load_full only; see crates/loricad/src/state.rs.
arc-swap = "1.7"
aya = "0.14.0"
aya-obj = "0.3.0"
# CachePadded, and nothing else from it. The published pointer is the one word the tick
# writes and every reader reads.
crossbeam-utils = "0.8"
libc = "0.2.189"
# The blocklist is mapped, never read into a buffer: 80 MiB of file-backed clean pages the
# kernel can evict, instead of 80 MiB of anonymous heap the allocator holds after the peak.
memmap2 = "0.9"
object = "0.39.1"
# One thread, no C dependency, 3 MiB of RSS and 17 us to open. The engine matters far less
# than the hardening cadence — two orders of magnitude between a non-durable commit and one
# with an fsync — so the cheap embedded one wins by default.
#
# 4.x and not 2.6, and the reason is a cost structure and not a version number. Under 2.6 the
# cheap commit got more expensive the longer hardening was deferred, because every
# `Durability::None` commit pinned a parent state redb had to keep and only a durable commit
# cleared them: measured 23.0 us at a cadence of 2, 37.6 at 100, 79 with no hardening at all.
# 3.0.0 fixed a "None commits linearly slower" regression and added a garbage collector for
# non-durable transactions; 4.2.0 (2026-08-17) claims `Durability::None` commits about twice
# as fast and space reclamation even with savepoints alive. `crates/loricad/tests/store.rs`
# is what re-measures it, and the cadence below the ceiling it asserts is the decision.
redb = "4.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# Two consumers, one declaration. The blocklist loader casts an mmapped file in place;
# the cardinality scan casts a batch-read buffer to `[u64]`, which
# `slice::from_raw_parts` on a pointer whose alignment comes from a syscall cannot be.
# `derive` is on because the loader needs it and it is the feature that earns itself:
# it refuses a struct with implicit padding, which is exactly the mistake a
# hand-written transmute plus a hand-written alignment check would not catch. It costs
# a proc-macro in the build graph; without it `cargo tree -e no-dev` showed the crate
# arriving with no transitive dependency at all.
zerocopy = { version = "0.8", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# The failure model is "the agent dies and the rules expire by TTL", so unwinding
# buys nothing and catch_unwind must not exist. To be stated in the public README.
panic = "abort"
strip = true

# opt-level = "z" is deliberately absent: the text segment is file-backed and
# demand-paged, so shrinking it wins no RSS.
[profile.profiling]
inherits = "release"
debug = true
strip = false
split-debuginfo = "off"
