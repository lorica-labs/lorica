[workspace]
resolver = "3"
members = [
    "crates/lorica-common",
    "crates/lorica-dataplane",
    "crates/lorica-detect",
    "crates/lorica-policy",
    "crates/lorica-escalate",
    "crates/loricad",
    "crates/lorica-ctl",
]
# lorica-ebpf is a workspace of its own, not a member. bpfel-unknown-none is a
# tier 3 target: it needs nightly and -Z build-std=core, and a toolchain cannot be
# selected per workspace member. Building it is an explicit step, not a side effect
# of `cargo check --workspace`.
exclude = ["bench", "crates/lorica-ebpf"]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/lorica-labs/lorica"
rust-version = "1.85"

[workspace.dependencies]
lorica-common = { path = "crates/lorica-common" }
lorica-dataplane = { path = "crates/lorica-dataplane" }
lorica-detect = { path = "crates/lorica-detect" }
lorica-escalate = { path = "crates/lorica-escalate" }
lorica-policy = { path = "crates/lorica-policy" }

anyhow = "1.0.104"
aya = "0.14.0"
aya-obj = "0.3.0"
libc = "0.2.189"
object = "0.39.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# A checked cast from a batch-read buffer to `[u64]`, which is what the alternative
# — `slice::from_raw_parts` on a pointer whose alignment comes from a syscall — cannot be.
# `default-features = false` because `derive` is what would pull a proc-macro into the
# build graph and nothing here derives: the whole use is one call, and
# `cargo tree -e no-dev` shows the crate arriving with zero transitive dependencies. The
# dev graph does build `zerocopy-derive`, and not on this crate's account: criterion pulls
# `half`, which asks for the feature.
zerocopy = { version = "0.8", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# The failure model is "the agent dies and the rules expire by TTL", so unwinding
# buys nothing and catch_unwind must not exist. To be stated in the public README.
panic = "abort"
strip = true

# opt-level = "z" is deliberately absent: the text segment is file-backed and
# demand-paged, so shrinking it wins no RSS.
[profile.profiling]
inherits = "release"
debug = true
strip = false
split-debuginfo = "off"
